name: Release host availability
on:
  push:
    paths: ['.github/workflows/release-host-028.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  availability:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - name: Verify native build host
        shell: pwsh
        run: |
          [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
          node --version
          git --version
