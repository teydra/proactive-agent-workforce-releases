name: Native packages 0.2.8
on:
  push:
    paths: ['.github/workflows/build-028.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arguments: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Read the compiled release payload from the private draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.8 --repo $env:GITHUB_REPOSITORY --pattern compiled-release-payload-r4.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Draft download failed' }
          $payload = Join-Path $env:RUNNER_TEMP compiled-release-payload-r4.zip
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b3512752c4ebecd05bdc67806d91bc6d488f2729e25d1ae91725abeffca16de3') { throw 'Payload integrity mismatch' }
          Expand-Archive -LiteralPath $payload -DestinationPath .
      - name: Install the pinned package dependencies
        run: npm ci --no-fund --no-audit
      - name: Prepare both macOS native architectures
        if: runner.os == 'macOS'
        run: node scripts/prepare-macos-addons.mjs
      - name: Package the compiled application
        run: npm run package -- ${{ matrix.arguments }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Configure the normal Chromium sandbox on the disposable Linux host
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
      - name: Verify packaged runtime and desktop on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/native-release-check.cjs
      - name: Verify packaged runtime and desktop on Windows and macOS
        if: runner.os != 'Linux'
        run: node scripts/native-release-check.cjs
      - name: Record Windows publisher signature status
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath dist/workforce-windows-x64.exe
          @{ status = $signature.Status.ToString(); publisher = $signature.SignerCertificate.Subject } | ConvertTo-Json | Set-Content -LiteralPath test-results/native-windows-trust.json
      - name: Save tested packages in the unpublished draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '\.(exe|AppImage|dmg|zip)(\.blockmap)?$|^latest(-linux|-mac)?\.yml$' })
          $assets += @(Get-ChildItem -Path test-results/native-* -File)
          $uploadArgs = @('release', 'upload', 'v0.2.8', '--repo', $env:GITHUB_REPOSITORY, '--clobber') + @($assets.FullName)
          & gh @uploadArgs
          if ($LASTEXITCODE) { throw 'Draft upload failed' }
      - name: Save isolated test diagnostics after a failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem -Path test-results/native-*-failure.* -File -ErrorAction SilentlyContinue)
          if ($files.Count) {
            $uploadArgs = @('release', 'upload', 'v0.2.8', '--repo', $env:GITHUB_REPOSITORY, '--clobber') + @($files.FullName)
            & gh @uploadArgs
            if ($LASTEXITCODE) { throw 'Diagnostic upload failed' }
          }
  verify-mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: Download the exact previously tested universal Mac package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.8 --repo $env:GITHUB_REPOSITORY --pattern compiled-release-payload-r4.zip --pattern workforce-mac-universal.zip --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE) { throw 'Draft download failed' }
          $payload = Join-Path $env:RUNNER_TEMP compiled-release-payload-r4.zip
          $mac = Join-Path $env:RUNNER_TEMP workforce-mac-universal.zip
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b3512752c4ebecd05bdc67806d91bc6d488f2729e25d1ae91725abeffca16de3') { throw 'Payload integrity mismatch' }
          if ((Get-FileHash -LiteralPath $mac -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b5a8368d48d58dd17810397212d2412b3a588f0995d8ae98e37cfa63a7c2546c') { throw 'Mac package integrity mismatch' }
          Expand-Archive -LiteralPath $payload -DestinationPath .
      - run: npm ci --no-fund --no-audit
      - name: Open the unchanged universal bundle on Intel
        shell: bash
        run: |
          mkdir -p dist/mac-universal
          ditto -x -k "$RUNNER_TEMP/workforce-mac-universal.zip" dist/mac-universal
          codesign --verify --deep --strict 'dist/mac-universal/Proactive Agent Workforce.app'
          node scripts/native-release-check.cjs
      - name: Preserve the Intel acceptance evidence in the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Move-Item -LiteralPath test-results/native-darwin.json -Destination test-results/native-darwin-x64.json
          Move-Item -LiteralPath test-results/native-darwin.png -Destination test-results/native-darwin-x64.png
          gh release upload v0.2.8 test-results/native-darwin-x64.json test-results/native-darwin-x64.png --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE) { throw 'Evidence upload failed' }
